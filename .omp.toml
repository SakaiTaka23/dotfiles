console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[palette]
word-black = '#282A36'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

  [[blocks.segments]]
  template = '  {{ .Path }} '
  foreground = 'p:word-black'
  background = '#BD93F9'
  type = 'path'
  style = 'diamond'
  leading_diamond = ''
  trailing_diamond = ''

    [blocks.segments.properties]
    cache_duration = 'none'
    home_icon = '~'
    style = 'full'

  [[blocks.segments]]
  template = ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
  foreground = 'p:word-black'
  powerline_symbol = ''
  background = '#50FA7B'
  type = 'git'
  style = 'powerline'
  background_templates = [
    '{{ if or (.Working.Changed) (.Staging.Changed) }}#50FA7B{{ end }}',
    '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#FF79C6{{ end }}',
    '{{ if gt .Ahead 0 }}#50FA7B{{ end }}',
    '{{ if gt .Behind 0 }}#FF79C6{{ end }}',
  ]

    [blocks.segments.properties]
    branch_icon = ' '
    cache_duration = 'none'
    fetch_stash_count = true
    fetch_status = true
    fetch_upstream_icon = true

  [[blocks.segments]]
  type = "python"
  style = "powerline"
  powerline_symbol = ""
  background = "#BD93F9"
  template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}"

[[blocks]]
type = 'prompt'
alignment = 'right'

  [[blocks.segments]]
  template = ' {{ if gt .Code 0 }}{{ reason .Code }}{{ else }}{{ end }} '
  foreground = 'p:word-black'
  powerline_symbol = ''
  background = '#8be9fd'
  type = 'status'
  style = 'powerline'
  background_templates = ['{{ if gt .Code 0 }}#FF5555{{ end }}']
  invert_powerline = true

    [blocks.segments.properties]
    cache_duration = 'none'

  [[blocks.segments]]
  template = '  {{ .FormattedMs }} '
  foreground = 'p:word-black'
  powerline_symbol = ''
  background = '#f1fa8c'
  type = 'executiontime'
  style = 'powerline'
  invert_powerline = true

    [blocks.segments.properties]
    cache_duration = 'none'
    style = 'round'
    threshold = 5000

  [[blocks.segments]]
  leading_diamond = ''
  trailing_diamond = ''
  template = '  {{ .CurrentDate | date .Format }}'
  foreground = 'p:word-black'
  background = '#F8F8F2'
  type = 'time'
  style = 'diamond'
  invert_powerline = true

    [blocks.segments.properties]
    cache_duration = 'none'
    time_format = '15:04'
